# regression-check.yml - how THIS repository runs its regression scenarios.
# The regression-check skill is generic; this file is the project's declaration.
# Reviewed like code. CI protects baseline_dir.

project: pyshop
baseline_dir: tests/baselines

# ---- Dependencies -----------------------------------------------------------
# The client decides which services are approved. The skill never infers
# deprecation from a name. A scenario fails its dependency assertion if any
# call in call_log went to a service not listed here (unless the scenario
# declares allow_deprecated: true with a reason).
approved_dependencies:
  - pricing-v2
deprecated_dependencies:
  - pricing-legacy

# ---- Runtime ----------------------------------------------------------------
app:
  start: "PYSHOP_DB=sqlite:///{db} PYSHOP_PORT={port} PYSHOP_CACHE_TTL=300 python -m pyshop.web.app"
  ready_url: "http://127.0.0.1:{port}/"
  ready_timeout_s: 20
  env:
    PYSHOP_DB: "sqlite:///{db}"        # also exported to batch/calculation commands

database:
  kind: sqlite
  reset: fresh_file                     # each scenario starts from the seed
  call_log_table: call_log             # where outbound service calls are recorded
  tables:                              # persisted state snapshotted after each scenario
    - { name: fund_prices,     key: [fund_id, price_date], fields: [fund_id, price_date, price, source], where: "price_date = '2026-10-31'" }
    - { name: load_rejections, key: [fund_id, price_date], fields: [fund_id, price_date, price, reference, reason] }
    - { name: forecasts,       key: [fund_id, scenario, period, metric], fields: [fund_id, scenario, period, metric, value] }

# ---- Comparison rules -------------------------------------------------------
tolerances:                            # approved by the reviewer, not chosen to pass
  default: { abs: 0.0 }
  forecasts.value: { abs: 0.01 }       # cents; forecast values are rounded to 2dp
normalize:
  - { path: "$.response.headers.Date",   replace: "<date>" }
  - { path: "$.response.headers.Server", replace: "<server>" }

# ---- Scenarios --------------------------------------------------------------
# type: service | batch | calculation | ui
# steps for service/ui: request | cache | clock | fixture
# A scenario can carry dependency expectations and business_fields.
scenarios:

  # -- Batch: the nightly price load, standard path and the conditional one --
  - id: load_prices_standard
    type: batch
    description: Nightly price load, all regions, default tolerance
    command: "python -m pyshop.batch.load_prices --file data/prices_2026-10-31.csv --as-of 2026-10-31"
    expect_dependencies: approved_only
    business_fields: ["summary.loaded", "summary.rejected"]
    parse_stdout: 'loaded=(?P<loaded>\d+) rejected=(?P<rejected>\d+)'

  - id: load_prices_region_amer
    type: batch
    description: Price load limited to AMER
    command: "python -m pyshop.batch.load_prices --file data/prices_2026-10-31.csv --as-of 2026-10-31 --region amer"
    expect_dependencies: approved_only
    parse_stdout: 'loaded=(?P<loaded>\d+) rejected=(?P<rejected>\d+)'

  - id: load_prices_region_apac
    type: batch
    description: Price load limited to APAC (the rarely run parameter combination)
    command: "python -m pyshop.batch.load_prices --file data/prices_2026-10-31.csv --as-of 2026-10-31 --region apac"
    expect_dependencies: approved_only
    parse_stdout: 'loaded=(?P<loaded>\d+) rejected=(?P<rejected>\d+)'

  # -- Calculation: the forecast across all funds --
  - id: forecast_all_funds
    type: calculation
    description: Forecast for the full fund population; compared row by row on (fund, scenario, period, metric)
    command: "python -m pyshop.calc.run_forecast"
    result_table: forecasts
    expected_values: tests/expected/forecast_spot_checks.json    # independently verified rows

  # -- Service: forecast endpoint under cache conditions --
  - id: forecast_cache_empty
    type: service
    description: First read populates the cache
    setup: ["python -m pyshop.calc.run_forecast --fund 1"]
    steps:
      - { request: { method: GET, path: /forecast/1 }, business_fields: ["from_cache", "rows[0].value"] }
      - { request: { method: GET, path: /cache/stats }, business_fields: ["hits", "misses"] }

  - id: forecast_cache_hit
    type: service
    description: Second read served from cache
    setup: ["python -m pyshop.calc.run_forecast --fund 1"]
    steps:
      - { request: { method: GET, path: /forecast/1 } }
      - { request: { method: GET, path: /forecast/1 }, business_fields: ["from_cache"] }

  - id: forecast_update_invalidates
    type: service
    description: The supported update path invalidates the cached forecast (freshness requirement)
    setup: ["python -m pyshop.calc.run_forecast --fund 1"]
    steps:
      - { request: { method: GET, path: /forecast/1 } }
      - { request: { method: PUT, path: /forecast/1, json: { scenario: base, period: 2027Q1, metric: distribution, value: 1020000 } }, business_fields: ["updated", "value"] }
      - { request: { method: GET, path: /forecast/1 }, business_fields: ["from_cache", "rows[1].value"] }

  - id: forecast_cache_expiry
    type: service
    description: After TTL the entry expires and is recomputed
    setup: ["python -m pyshop.calc.run_forecast --fund 1"]
    steps:
      - { request: { method: GET, path: /forecast/1 } }
      - { clock: { advance_seconds: 301 } }
      - { request: { method: GET, path: /forecast/1 }, business_fields: ["from_cache"] }

  # -- Service: price lookup under every cache condition (freshness policy in pyshop/web/forecast.py) --
  - id: price_source_changes_after_caching
    type: service
    description: Source price changes after it was cached; within TTL the cached value is served, after TTL the new one
    steps:
      - { request: { method: GET, path: /price/1 }, business_fields: ["price", "from_cache"] }
      - { fixture: "python -m pyshop.batch.fixture set-price --fund 1 --date 2026-10-30 --price 103.00" }
      - { request: { method: GET, path: /price/1 }, business_fields: ["price", "from_cache"] }
      - { clock: { advance_seconds: 301 } }
      - { request: { method: GET, path: /price/1 }, business_fields: ["price", "from_cache"] }

  - id: price_source_unavailable_stale_fallback
    type: service
    description: Pricing service unavailable after expiry; a stale cached price is served and flagged
    steps:
      - { request: { method: GET, path: /price/1 } }
      - { fixture: "python -m pyshop.batch.fixture set-setting --key pricing-v2.unavailable --value 1" }
      - { clock: { advance_seconds: 301 } }
      - { request: { method: GET, path: /price/1 }, business_fields: ["price", "stale", "from_cache"] }
      - { request: { method: GET, path: /price/2 }, business_fields: ["error"] }

  # -- Service: the rarely used report --
  - id: holdings_report_amer
    type: service
    description: Holdings valuation report for AMER as of 2026-10-30
    expect_dependencies: approved_only
    steps:
      - { request: { method: GET, path: "/report/holdings?region=amer&as_of=2026-10-30" },
          business_fields: ["pricing_service", "total_value", "rows[0].price"] }

  # -- UI: the fund page after an update --
  - id: ui_fund_page_after_update
    type: ui
    description: Fund page shows the updated value after a PUT
    setup: ["python -m pyshop.calc.run_forecast --fund 1"]
    steps:
      - { request: { method: GET, path: /funds/1 } }
      - { request: { method: PUT, path: /forecast/1, json: { scenario: base, period: 2027Q1, metric: distribution, value: 1020000 } } }
      - { browser: { goto: /funds/1, read: { selector: "tr[data-key='base|2027Q1|distribution'] .value", as: value } },
          business_fields: ["value"] }

  - id: ui_catalog_price_filter
    type: ui
    description: Catalog page filtered to a brand shows only that brand's items and a matching count
    steps:
      - { browser: { goto: "/?brand=2", read: { selector: "#count", as: count } }, business_fields: ["count"] }
      - { browser: { goto: "/?brand=2", read: { selector: "li.item .pname", as: first_item } }, business_fields: ["first_item"] }

baseline_approval:
  label: baseline-change
  codeowners_path: tests/baselines/
