# regression-check.yml - per-repository configuration for the regression-check skill.
# The skill is generic; this file declares how THIS project runs and what counts
# as a business field. Keep it in the repo root. Reviewed like code.

project: pyshop
runner: python            # python | dotnet  (selects how scripts invoke commands)

# Where baselines live. The CI guard protects this path.
baseline_dir: tests/baselines

# How to stand the application up for a capture run. {db} is replaced by an
# absolute path to a fresh SQLite file for that run; {port} by a free port.
app:
  start: "PYSHOP_DB=sqlite:///{db} PYSHOP_PORT={port} python -m pyshop.web.app"
  ready_url: "http://127.0.0.1:{port}/"
  ready_timeout_s: 20

# Database lifecycle per run. For SQLite a fresh file is a reset; seed happens
# on first start (create_app seeds an empty file DB). For a server DB, put the
# reset/seed commands here and reference them from capture.py.
database:
  kind: sqlite
  reset: fresh_file
  tables:                   # persisted state to snapshot after each scenario
    - name: orders
      key: [id]
      fields: [id, total]
    - name: order_lines
      key: [order_id, item_id]
      fields: [order_id, item_id, quantity, unit_price]
    - name: items
      key: [id]
      fields: [id, stock]
      where: "id IN (1, 7, 30)"   # only the items scenarios touch; keep snapshots small

# Scenarios: each runs against a fresh database. Steps are HTTP calls; the
# response of every step is captured. Business fields are listed so the diff
# can name them; everything else in the response is compared too unless
# listed under normalize.
scenarios:
  - id: order_two_mugs
    description: Order two Azure Mugs (item 1, $8.50, stock 10)
    steps:
      - method: POST
        path: /order
        json: {"lines": [{"item_id": 1, "quantity": 2}]}
        business_fields: ["total", "lines[0].quantity", "lines[0].unit_price"]
      - method: GET
        path: /order/1
        business_fields: [total]
  - id: order_mixed_lines
    description: One order with two lines (items 1 and 7)
    steps:
      - method: POST
        path: /order
        json: {"lines": [{"item_id": 1, "quantity": 1}, {"item_id": 7, "quantity": 3}]}
        business_fields: [total, lines]
  - id: order_rejected_out_of_stock
    description: Item 30 has stock 3; ordering 4 is refused and stock is unchanged
    steps:
      - method: POST
        path: /order
        json: {"lines": [{"item_id": 30, "quantity": 4}]}
        business_fields: [error]
  - id: order_bad_body
    description: Empty lines list is a 400
    steps:
      - method: POST
        path: /order
        json: {"lines": []}
        business_fields: [error]

# Values that legitimately differ between runs. Matched by JSON path within a
# response or a table row; replaced with the placeholder before comparison.
normalize:
  - path: "$.response.headers.Date"
    replace: "<date>"
  - path: "$.response.headers.Server"
    replace: "<server>"

# Who may approve a change to a baseline file. Enforced by CI (baseline-guard
# workflow) + CODEOWNERS, not by this file.
baseline_approval:
  label: baseline-change
  codeowners_path: tests/baselines/
